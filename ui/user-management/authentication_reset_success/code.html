<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Khôi phục mật khẩu thành công - WordAI</title>
<!-- Fonts: Manrope (Headline/UI) & Newsreader (Body/Creation) & Inter (Label) -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@400;500;600;700;800&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Ethereal Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "error-container": "#ffdad6",
                        "on-primary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "inverse-surface": "#2e3132",
                        "primary-fixed-dim": "#c1c1ff",
                        "outline": "#767586",
                        "surface-container-highest": "#e1e3e4",
                        "error": "#ba1a1a",
                        "primary": "#4343d5",
                        "on-tertiary": "#ffffff",
                        "on-error": "#ffffff",
                        "inverse-primary": "#c1c1ff",
                        "tertiary-fixed-dim": "#ffb689",
                        "outline-variant": "#c7c4d7",
                        "on-tertiary-container": "#fff6f3",
                        "tertiary-fixed": "#ffdbc8",
                        "on-surface": "#191c1d",
                        "on-secondary-fixed-variant": "#3f417b",
                        "surface-container-high": "#e7e8e9",
                        "on-secondary": "#ffffff",
                        "surface": "#f8f9fa",
                        "secondary-fixed": "#e1e0ff",
                        "on-secondary-container": "#474984",
                        "tertiary-container": "#b65700",
                        "primary-container": "#5d5fef",
                        "on-tertiary-fixed-variant": "#743500",
                        "on-primary-container": "#faf7ff",
                        "tertiary": "#904400",
                        "on-background": "#191c1d",
                        "secondary-fixed-dim": "#c1c1ff",
                        "on-surface-variant": "#464555",
                        "inverse-on-surface": "#f0f1f2",
                        "surface-container-low": "#f3f4f5",
                        "surface-dim": "#d9dadb",
                        "on-primary-fixed-variant": "#2e2bc2",
                        "on-secondary-fixed": "#12134d",
                        "secondary": "#575995",
                        "surface-variant": "#e1e3e4",
                        "surface-container": "#edeeef",
                        "secondary-container": "#babbfe",
                        "primary-fixed": "#e1e0ff",
                        "on-tertiary-fixed": "#321300",
                        "background": "#f8f9fa",
                        "surface-tint": "#4849da",
                        "on-error-container": "#93000a",
                        "surface-bright": "#f8f9fa",
                        "on-primary-fixed": "#07006c"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    fontFamily: {
                        "headline": ["Manrope", "sans-serif"],
                        "display": ["Manrope", "sans-serif"],
                        "body": ["Newsreader", "serif"],
                        "label": ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface text-on-surface font-headline min-h-screen flex items-center justify-center relative overflow-hidden antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Ambient Aura Background (Ethereal AuraSphere Concept) -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-primary/5 blur-[120px] mix-blend-multiply opacity-70"></div>
<div class="absolute bottom-[-20%] right-[-10%] w-[60vw] h-[60vw] rounded-full bg-secondary-container/15 blur-[150px] mix-blend-multiply opacity-50"></div>
</div>
<!-- Main Content Canvas -->
<main class="relative z-10 w-full max-w-lg px-6">
<!-- Glassmorphism Modal (Liquid Data feel, no solid lines) -->
<div class="bg-surface-container-lowest/80 backdrop-blur-[20px] rounded-[24px] p-12 flex flex-col items-center text-center shadow-[0_0_60px_-5px_rgba(67,67,213,0.08)] ring-1 ring-outline-variant/15 relative overflow-hidden">
<!-- Subtle Top Glow -->
<div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-transparent via-primary/30 to-transparent"></div>
<!-- Large "Liquid" Success Icon -->
<div class="relative mb-8 flex items-center justify-center group">
<div class="absolute inset-0 bg-primary/10 rounded-full blur-[20px] scale-150 transition-transform duration-700 ease-out group-hover:scale-175"></div>
<!-- Note: Design System palette used strictly. 'primary' represents the system's core positive/action state in the absence of a tokenized green. -->
<span class="material-symbols-outlined text-[80px] text-primary relative z-10" style="font-variation-settings: 'FILL' 1, 'wght' 300;">
                    check_circle
                </span>
</div>
<!-- Success Message (Intentional typography hierarchy) -->
<div class="space-y-3 mb-10">
<h1 class="font-headline text-2xl md:text-3xl font-bold tracking-tight text-on-surface">
                    Đã gửi email thành công!
                </h1>
<p class="font-body text-lg text-on-surface-variant leading-relaxed max-w-[280px] mx-auto">
                    Vui lòng kiểm tra hòm thư của bạn.
                </p>
</div>
<!-- Fluid Primary Button -->
<button class="w-full sm:w-auto px-10 py-4 bg-primary text-on-primary rounded-xl font-headline text-xs tracking-[0.05em] uppercase font-bold transition-all duration-300 hover:bg-primary-container hover:shadow-[0_0_20px_-2px_rgba(67,67,213,0.3)] active:bg-surface-tint focus:outline-none focus:ring-2 focus:ring-primary/50 focus:ring-offset-2 focus:ring-offset-surface-container-lowest relative overflow-hidden group">
<span class="relative z-10 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 0, 'wght' 600;">arrow_back</span>
                    Về trang Đăng nhập
                </span>
<!-- Liquid displacement effect on press -->
<div class="absolute inset-0 bg-white/0 group-active:bg-white/20 transition-colors duration-150"></div>
</button>
</div>
</main>
</body></html>
