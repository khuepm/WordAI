<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Ethereal - Đăng nhập</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "error-container": "#ffdad6",
                    "on-primary": "#ffffff",
                    "surface-container-lowest": "#ffffff",
                    "inverse-surface": "#2e3132",
                    "primary-fixed-dim": "#c1c1ff",
                    "outline": "#767586",
                    "surface-container-highest": "#e1e3e4",
                    "error": "#ba1a1a",
                    "primary": "#4343d5",
                    "on-tertiary": "#ffffff",
                    "on-error": "#ffffff",
                    "inverse-primary": "#c1c1ff",
                    "tertiary-fixed-dim": "#ffb689",
                    "outline-variant": "#c7c4d7",
                    "on-tertiary-container": "#fff6f3",
                    "tertiary-fixed": "#ffdbc8",
                    "on-surface": "#191c1d",
                    "on-secondary-fixed-variant": "#3f417b",
                    "surface-container-high": "#e7e8e9",
                    "on-secondary": "#ffffff",
                    "surface": "#f8f9fa",
                    "secondary-fixed": "#e1e0ff",
                    "on-secondary-container": "#474984",
                    "tertiary-container": "#b65700",
                    "primary-container": "#5d5fef",
                    "on-tertiary-fixed-variant": "#743500",
                    "on-primary-container": "#faf7ff",
                    "tertiary": "#904400",
                    "on-background": "#191c1d",
                    "secondary-fixed-dim": "#c1c1ff",
                    "on-surface-variant": "#464555",
                    "inverse-on-surface": "#f0f1f2",
                    "surface-container-low": "#f3f4f5",
                    "surface-dim": "#d9dadb",
                    "on-primary-fixed-variant": "#2e2bc2",
                    "on-secondary-fixed": "#12134d",
                    "secondary": "#575995",
                    "surface-variant": "#e1e3e4",
                    "surface-container": "#edeeef",
                    "secondary-container": "#babbfe",
                    "primary-fixed": "#e1e0ff",
                    "on-tertiary-fixed": "#321300",
                    "background": "#f8f9fa",
                    "surface-tint": "#4849da",
                    "on-error-container": "#93000a",
                    "surface-bright": "#f8f9fa",
                    "on-primary-fixed": "#07006c"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {},
            "fontFamily": {
                    "headline": [
                            "Manrope"
                    ],
                    "display": [
                            "Manrope"
                    ],
                    "body": [
                            "Newsreader"
                    ],
                    "label": [
                            "Inter"
                    ]
            },
            "fontSize": {}
    },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Ambient AI Glow specific utility */
        .shadow-ambient-glow {
            box-shadow: 0 20px 60px -5px rgba(67, 67, 213, 0.08);
        }
        
        /* Input focus bottom glow */
        .input-glow-focus:focus-within {
            box-shadow: inset 0 -2px 0 0 #4343d5;
            background-color: #ffffff;
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body antialiased min-h-screen relative overflow-hidden">
<!-- Background Layer: App Content -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-50 blur-[2px]">
<!-- TopNavBar (JSON Anchor) -->
<header class="bg-surface/80 backdrop-blur-xl docked full-width top-0 z-40">
<div class="flex justify-between items-center w-full px-12 py-6 max-w-[1440px] mx-auto">
<!-- Brand -->
<div class="font-headline font-bold text-xl tracking-tighter text-on-surface">
                    Ethereal
                </div>
<!-- Navigation -->
<nav class="hidden md:flex items-center gap-8 font-headline text-label-md tracking-wider uppercase">
<a class="text-on-surface-variant hover:text-on-surface transition-colors" href="#">Library</a>
<a class="text-on-surface-variant hover:text-on-surface transition-colors" href="#">Drafts</a>
<a class="text-on-surface-variant hover:text-on-surface transition-colors" href="#">Archive</a>
</nav>
<!-- Actions -->
<div class="flex items-center gap-6 font-headline text-label-md tracking-wider uppercase">
<button class="text-primary font-bold border-b-2 border-primary pb-1">Sign In</button>
<button class="bg-surface-container hover:bg-surface-container-high transition-all duration-300 px-6 py-3 rounded-xl text-on-surface font-semibold tracking-wide">Write Now</button>
</div>
</div>
</header>
<!-- Mock Canvas to give depth -->
<main class="max-w-[1440px] mx-auto px-12 py-24">
<div class="bg-surface-container-lowest rounded-xl p-12 min-h-[600px] shadow-sm">
<div class="w-2/3 h-8 bg-surface-container-low rounded-md mb-6"></div>
<div class="w-full h-4 bg-surface-container-low rounded-md mb-4"></div>
<div class="w-5/6 h-4 bg-surface-container-low rounded-md mb-4"></div>
<div class="w-4/6 h-4 bg-surface-container-low rounded-md mb-4"></div>
</div>
</main>
</div>
<!-- Active Layer: Authentication Modal -->
<!-- Backdrop: Dimmed 0.4 opacity -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-inverse-surface/40 backdrop-blur-sm p-4">
<!-- Modal Container: Glassmorphism, AuraSphere styling -->
<div class="bg-surface-container-lowest/80 backdrop-blur-[20px] shadow-ambient-glow rounded-xl w-full max-w-md relative overflow-hidden transform transition-all scale-100">
<!-- Subtle gradient glow for active high-intent feeling -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary to-primary-container opacity-80"></div>
<div class="p-10">
<!-- Title -->
<h2 class="font-headline text-[2rem] font-bold text-on-surface tracking-tight mb-8">
                    Đăng nhập
                </h2>
<!-- Error Banner -->
<div class="bg-error-container text-on-error-container rounded-lg p-4 mb-8 flex items-start gap-3">
<span class="material-symbols-outlined mt-0.5" data-icon="error" data-weight="fill" style="font-variation-settings: 'FILL' 1;">error</span>
<p class="font-headline text-sm font-medium leading-snug">
                        Thông tin đăng nhập không hợp lệ. Vui lòng kiểm tra lại email và mật khẩu.
                    </p>
</div>
<!-- Form -->
<form class="space-y-6">
<!-- Email Field (Focused) -->
<div class="space-y-2">
<label class="block font-headline text-xs font-bold text-on-surface-variant uppercase tracking-wider">Email</label>
<div class="input-glow-focus bg-surface-container-lowest rounded-lg transition-all duration-200 flex items-center h-12 px-4 shadow-[inset_0_-2px_0_0_#4343d5]">
<input autofocus="" class="w-full bg-transparent border-none outline-none ring-0 text-on-surface font-headline p-0" type="email" value="curator@ethereal.app"/>
<!-- Fake cursor for visual representation of focus -->
<span class="w-[1px] h-5 bg-primary animate-pulse ml-0.5"></span>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-end">
<label class="block font-headline text-xs font-bold text-on-surface-variant uppercase tracking-wider">Mật khẩu</label>
<a class="font-headline text-xs text-primary hover:text-primary-container transition-colors font-medium" href="#">Quên mật khẩu?</a>
</div>
<div class="input-glow-focus bg-surface-container-low rounded-lg transition-all duration-200 flex items-center h-12 px-4">
<input class="w-full bg-transparent border-none outline-none ring-0 text-on-surface font-headline p-0" type="password" value="••••••••"/>
</div>
</div>
<!-- Primary Action -->
<div class="pt-4">
<button class="w-full bg-primary text-on-primary hover:bg-primary-container hover:shadow-[0_0_12px_-2px_rgba(67,67,213,0.4)] active:bg-surface-tint rounded-xl h-12 flex items-center justify-center gap-3 transition-all duration-200 font-headline font-semibold tracking-wide" type="button">
<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span>
                            Đăng nhập
                        </button>
</div>
</form>
<!-- Footer Links -->
<div class="mt-8 text-center">
<p class="font-headline text-sm text-on-surface-variant">
                        Chưa có tài khoản? 
                        <a class="text-primary font-bold hover:text-primary-container transition-colors" href="#">Đăng ký</a>
</p>
</div>
</div>
</div>
</div>
</body></html>
