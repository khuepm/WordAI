<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Đăng ký - WordAI</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "error-container": "#ffdad6",
                      "on-primary": "#ffffff",
                      "surface-container-lowest": "#ffffff",
                      "inverse-surface": "#2e3132",
                      "primary-fixed-dim": "#c1c1ff",
                      "outline": "#767586",
                      "surface-container-highest": "#e1e3e4",
                      "error": "#ba1a1a",
                      "primary": "#4343d5",
                      "on-tertiary": "#ffffff",
                      "on-error": "#ffffff",
                      "inverse-primary": "#c1c1ff",
                      "tertiary-fixed-dim": "#ffb689",
                      "outline-variant": "#c7c4d7",
                      "on-tertiary-container": "#fff6f3",
                      "tertiary-fixed": "#ffdbc8",
                      "on-surface": "#191c1d",
                      "on-secondary-fixed-variant": "#3f417b",
                      "surface-container-high": "#e7e8e9",
                      "on-secondary": "#ffffff",
                      "surface": "#f8f9fa",
                      "secondary-fixed": "#e1e0ff",
                      "on-secondary-container": "#474984",
                      "tertiary-container": "#b65700",
                      "primary-container": "#5d5fef",
                      "on-tertiary-fixed-variant": "#743500",
                      "on-primary-container": "#faf7ff",
                      "tertiary": "#904400",
                      "on-background": "#191c1d",
                      "secondary-fixed-dim": "#c1c1ff",
                      "on-surface-variant": "#464555",
                      "inverse-on-surface": "#f0f1f2",
                      "surface-container-low": "#f3f4f5",
                      "surface-dim": "#d9dadb",
                      "on-primary-fixed-variant": "#2e2bc2",
                      "on-secondary-fixed": "#12134d",
                      "secondary": "#575995",
                      "surface-variant": "#e1e3e4",
                      "surface-container": "#edeeef",
                      "secondary-container": "#babbfe",
                      "primary-fixed": "#e1e0ff",
                      "on-tertiary-fixed": "#321300",
                      "background": "#f8f9fa",
                      "surface-tint": "#4849da",
                      "on-error-container": "#93000a",
                      "surface-bright": "#f8f9fa",
                      "on-primary-fixed": "#07006c"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {},
              "fontFamily": {
                      "headline": [
                              "Manrope"
                      ],
                      "display": [
                              "Manrope"
                      ],
                      "body": [
                              "Newsreader"
                      ],
                      "label": [
                              "Inter"
                      ]
              },
              "fontSize": {}
      },
          },
        }
      </script>
<style>
        body {
            background-color: theme('colors.surface');
            color: theme('colors.on-surface');
            font-family: theme('fontFamily.headline');
        }
      </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 antialiased overflow-hidden relative">
<!-- Ambient Aura Background -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-40">
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-primary-container blur-[120px] opacity-30"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[60%] h-[60%] rounded-full bg-primary-container blur-[150px] opacity-20"></div>
</div>
<!-- Main Registration Modal -->
<main class="w-full max-w-md relative z-10">
<div class="bg-surface-container-lowest/80 backdrop-blur-[20px] rounded-xl p-10 md:p-12 border border-outline-variant/15 shadow-[0_40px_60px_-15px_rgba(25,28,29,0.04)]">
<!-- Header -->
<div class="mb-10 text-center">
<div class="inline-flex items-center justify-center w-12 h-12 rounded-lg bg-surface-container-low mb-6">
<span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1;">
                        edit_note
                    </span>
</div>
<h1 class="font-headline text-3xl tracking-tighter font-bold text-on-surface mb-2">Tạo tài khoản</h1>
<p class="font-body text-on-surface-variant text-base leading-relaxed">Bắt đầu không gian sáng tạo của bạn.</p>
</div>
<!-- Form -->
<form class="space-y-6" novalidate="">
<!-- Display Name -->
<div class="space-y-2">
<label class="block font-headline text-label-md tracking-wider uppercase text-on-surface-variant" for="displayName">Tên hiển thị</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-0 rounded-lg px-4 py-3.5 text-on-surface font-headline focus:ring-0 focus:bg-surface-container-lowest focus:shadow-[0_2px_0_0_theme('colors.primary')] transition-all placeholder:text-outline/50" id="displayName" placeholder="Ví dụ: The Curator" type="text"/>
</div>
</div>
<!-- Email -->
<div class="space-y-2">
<label class="block font-headline text-label-md tracking-wider uppercase text-on-surface-variant" for="email">Email</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-0 rounded-lg px-4 py-3.5 text-on-surface font-headline focus:ring-0 focus:bg-surface-container-lowest focus:shadow-[0_2px_0_0_theme('colors.primary')] transition-all placeholder:text-outline/50" id="email" placeholder="ten@mien.com" type="email"/>
</div>
</div>
<!-- Password -->
<div class="space-y-2">
<label class="block font-headline text-label-md tracking-wider uppercase text-on-surface-variant" for="password">Mật khẩu</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-0 rounded-lg px-4 py-3.5 text-on-surface font-headline focus:ring-0 focus:bg-surface-container-lowest focus:shadow-[0_2px_0_0_theme('colors.primary')] transition-all placeholder:text-outline/50" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Confirm Password (Error State) -->
<div class="space-y-2">
<label class="block font-headline text-label-md tracking-wider uppercase text-on-surface-variant" for="confirmPassword">Xác nhận mật khẩu</label>
<div class="relative">
<input class="w-full bg-error-container border-0 rounded-lg px-4 py-3.5 text-on-error-container font-headline focus:ring-0 focus:shadow-[0_2px_0_0_theme('colors.error')] transition-all" id="confirmPassword" placeholder="••••••••" type="password" value="•••••••"/>
<div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-error">error</span>
</div>
</div>
<p class="text-error text-sm font-headline mt-1 flex items-center gap-1">
                        Mật khẩu không khớp
                    </p>
</div>
<!-- Action Button -->
<div class="pt-4">
<button class="w-full bg-surface-container-highest text-outline font-headline font-bold py-4 px-6 rounded-lg cursor-not-allowed transition-all opacity-70" disabled="" type="button">
                        Đăng ký
                    </button>
</div>
</form>
<!-- Footer Links -->
<div class="mt-8 text-center">
<a class="font-headline text-sm text-on-surface-variant hover:text-primary transition-colors" href="#">
                    Đã có tài khoản? <span class="font-bold border-b border-transparent hover:border-primary">Quay lại đăng nhập</span>
</a>
</div>
</div>
</main>
</body></html>
